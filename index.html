<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>할 일 달력</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div>
      <h1>할 일 달력</h1>
      <p class="muted">날짜별로 할 일을 관리하고 공휴일을 함께 확인하세요</p>
    </div>
    <div id="user-area" class="user-area hidden">
      <span id="user-nickname"></span>님
      <button id="logout-btn" class="btn-secondary" type="button">로그아웃</button>
    </div>
  </header>

  <main class="container">
    <p id="message" class="message hidden"></p>

    <!-- 로그인 / 회원가입 -->
    <section id="auth-section" class="card hidden">
      <div class="tabs">
        <button id="tab-login" class="tab active" type="button">로그인</button>
        <button id="tab-signup" class="tab" type="button">회원가입</button>
      </div>

      <form id="login-form" class="form">
        <label>이메일
          <input id="login-email" type="email" required autocomplete="email">
        </label>
        <label>비밀번호
          <input id="login-password" type="password" required autocomplete="current-password">
        </label>
        <button class="btn-primary" type="submit">로그인</button>
      </form>

      <form id="signup-form" class="form hidden">
        <label>닉네임
          <input id="signup-nickname" type="text" required maxlength="20" autocomplete="nickname">
        </label>
        <label>이메일
          <input id="signup-email" type="email" required autocomplete="email">
        </label>
        <label>비밀번호 (6자 이상)
          <input id="signup-password" type="password" required minlength="6" autocomplete="new-password">
        </label>
        <button class="btn-primary" type="submit">가입하기</button>
      </form>
    </section>

    <!-- 달력과 할 일 -->
    <div id="app-section" class="hidden">
      <section class="card">
        <div class="cal-header">
          <button id="prev-btn" class="btn-secondary" type="button" aria-label="이전 달">&lt;</button>
          <h2 id="month-title"></h2>
          <button id="next-btn" class="btn-secondary" type="button" aria-label="다음 달">&gt;</button>
          <button id="today-btn" class="btn-secondary" type="button">오늘</button>
        </div>
        <div id="calendar-grid" class="calendar-grid"></div>
      </section>

      <section class="card">
        <h2 id="selected-date"></h2>
        <p id="selected-holiday" class="holiday-label hidden"></p>
        <form id="todo-form" class="todo-form">
          <input id="todo-input" type="text" placeholder="이 날의 할 일을 입력하세요" maxlength="100" required>
          <button class="btn-primary" type="submit">추가</button>
        </form>
        <ul id="todo-list" class="todo-list"></ul>
        <p id="empty-message" class="empty hidden">이 날짜에 등록된 할 일이 없습니다. 위에서 추가해 보세요.</p>
      </section>
    </div>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
